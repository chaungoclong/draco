name: CI

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install minimal Linux GUI & font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            pkg-config \
            fonts-dejavu-core

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy linter (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, feature & headless E2E tests
        run: cargo test -- --test-threads=4
