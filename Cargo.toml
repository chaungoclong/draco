[package]
name = "draco"
version = "0.1.0"
edition = "2024"
description = "Draco — a lightweight, fast GPU-accelerated GUI code editor in Rust"

[dependencies]
eframe = "0.31"
ropey = "1.6"
regex = "1.11"
ignore = "0.4"
arboard = "3.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1"
url = "2.5"
portable-pty = "0.8"
vte = "0.15"
pulldown-cmark = "0.13"
unicode-width = "0.2"
nucleo-matcher = "0.3"
fontdb = "0.23"
directories = "6"
notify = "8"
mermaid-svg = "0.7"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }

tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-c = "0.23"
tree-sitter-md = "0.3"
tree-sitter-php = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
